name: GeoEco production verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 60

      - name: Python Earth Engine self-test
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 180             https://geospatial-restoration-q1.vercel.app/api/geoeco_engine             -o /tmp/selftest.json
          cat /tmp/selftest.json
          python -c "import json; x=json.load(open('/tmp/selftest.json')); assert x.get('status')=='success',x; assert x.get('sampleCountReturned',0)>0,x"

      - name: Generate NDVI map and download raster
        run: |
          set -euo pipefail
          cat >/tmp/map-payload.json <<'JSON'
          {
            "action":"map",
            "start":"2024-01-01",
            "end":"2026-09-19",
            "layer":"NDVI",
            "aoi":{"type":"FeatureCollection","features":[{"type":"Feature","properties":{},"geometry":{"type":"Polygon","coordinates":[[[114.55,-3.45],[114.75,-3.45],[114.75,-3.25],[114.55,-3.25],[114.55,-3.45]]]}}]}
          }
          JSON
          curl --fail --show-error --silent --max-time 300             -H 'content-type: application/json'             --data-binary @/tmp/map-payload.json             https://geospatial-restoration-q1.vercel.app/api/geoeco_engine             -o /tmp/map.json
          cat /tmp/map.json
          python -c "import json; x=json.load(open('/tmp/map.json')); assert x.get('status')=='success',x; assert x.get('imageUrl'),x; assert len(x.get('legend') or [])==5,x; assert len(x.get('classArea') or [])>0,x"
          IMG=$(python -c "import json; print(json.load(open('/tmp/map.json'))['imageUrl'])")
          curl --fail --show-error --silent --max-time 120 "$IMG" -o /tmp/result.png
          test -s /tmp/result.png
          file /tmp/result.png | grep -q "PNG image data"
          echo "PNG_BYTES=$(stat -c%s /tmp/result.png)"

      - name: Generate spatial statistics
        run: |
          set -euo pipefail
          cat >/tmp/stats-payload.json <<'JSON'
          {
            "action":"stats",
            "start":"2024-01-01",
            "end":"2026-09-19",
            "aoi":{"type":"FeatureCollection","features":[{"type":"Feature","properties":{},"geometry":{"type":"Polygon","coordinates":[[[114.55,-3.45],[114.75,-3.45],[114.75,-3.25],[114.55,-3.25],[114.55,-3.45]]]}}]}
          }
          JSON
          curl --fail --show-error --silent --max-time 300             -H 'content-type: application/json'             --data-binary @/tmp/stats-payload.json             https://geospatial-restoration-q1.vercel.app/api/geoeco_engine             -o /tmp/stats.json
          cat /tmp/stats.json
          python -c "import json; x=json.load(open('/tmp/stats.json')); assert x.get('status')=='success',x; assert x.get('mode')=='spatial-sample',x; assert x.get('sampleCountReturned',0)>100,x; rows=x.get('rows') or []; assert any(r.get('NDVI') is not None for r in rows),x; assert any(r.get('NDRE') is not None for r in rows),x; assert any(r.get('LST') is not None for r in rows),x"

      - name: Verify NASA FIRMS fire intelligence
        run: |
          set -euo pipefail
          cat >/tmp/fire.json <<'JSON'
          {
            "end":"2026-09-15",
            "days":7,
            "responseWindowMinutes":60,
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [113.5,-4.5],[116.0,-4.5],[116.0,-1.5],[113.5,-1.5],[113.5,-4.5]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --retry 3 --retry-delay 2 --retry-all-errors --max-time 300             -H 'content-type: application/json'             --data-binary @/tmp/fire.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/fire             -o /tmp/fire-result.json
          cat /tmp/fire-result.json
          python -c "import json; x=json.load(open('/tmp/fire-result.json')); assert x.get('status')=='success',x; assert 'summary' in x,x; assert 'spreadProxy' in x,x; assert 'provenance' in x,x; print('HOTSPOTS',x.get('summary',{}).get('count'))"



      - name: Verify zero-hotspot AOI
        run: |
          set -euo pipefail
          cat >/tmp/fire-zero.json <<'JSON'
          {
            "end":"2026-09-19",
            "days":7,
            "responseWindowMinutes":60,
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [109.00,-3.00],[109.10,-3.00],[109.10,-2.90],[109.00,-2.90],[109.00,-3.00]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --retry 3 --retry-delay 2 --retry-all-errors --max-time 180 \
            -H 'content-type: application/json' \
            --data-binary @/tmp/fire-zero.json \
            https://geospatial-restoration-q1.vercel.app/api/geoeco/fire \
            -o /tmp/fire-zero-result.json
          cat /tmp/fire-zero-result.json
          python -c "import json; x=json.load(open('/tmp/fire-zero-result.json')); assert x.get('status')=='success',x; assert x.get('summary',{}).get('count')==0,x; assert x.get('goldenTime') is None,x; print('ZERO HOTSPOT HANDLED')"
