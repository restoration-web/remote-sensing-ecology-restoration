name: GeoEco production smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 110

      - name: Check GeoEco health endpoint
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60             https://geospatial-restoration-q1.vercel.app/api/geoeco/health             -o /tmp/health.json
          cat /tmp/health.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/health.json'))
          assert x.get('status')=='success', x
          assert x.get('thumbGenerated') is True, x
          PY

      - name: Generate NDVI map from sample AOI
        run: |
          set -euo pipefail
          cat >/tmp/payload.json <<'JSON'
          {
            "start":"2026-01-01",
            "end":"2026-09-01",
            "layer":"NDVI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[
                {
                  "type":"Feature",
                  "properties":{},
                  "geometry":{
                    "type":"Polygon",
                    "coordinates":[[
                      [114.55,-3.45],
                      [114.65,-3.45],
                      [114.65,-3.35],
                      [114.55,-3.35],
                      [114.55,-3.45]
                    ]]
                  }
                }
              ]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 180             -H 'content-type: application/json'             --data-binary @/tmp/payload.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/analysis             -o /tmp/map.json
          cat /tmp/map.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/map.json'))
          assert x.get('status')=='success', x
          assert x.get('layer')=='NDVI', x
          assert x.get('imageUrl'), x
          assert len(x.get('legend') or [])==5, x
          assert isinstance(x.get('classArea'), list), x
          PY

      - name: Run temporal statistics endpoint
        run: |
          set -euo pipefail
          cat >/tmp/time.json <<'JSON'
          {
            "period":{"start":2024,"end":2026},
            "sensor":"Landsat 5/7/8/9",
            "variables":["NDVI","EVI","SAVI","NDMI","NDWI","BSI","LST","Rainfall"],
            "aoiName":"Smoke AOI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[
                {
                  "type":"Feature",
                  "properties":{},
                  "geometry":{
                    "type":"Polygon",
                    "coordinates":[[
                      [114.55,-3.45],
                      [114.65,-3.45],
                      [114.65,-3.35],
                      [114.55,-3.35],
                      [114.55,-3.45]
                    ]]
                  }
                }
              ]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 240             -H 'content-type: application/json'             --data-binary @/tmp/time.json             https://geospatial-restoration-q1.vercel.app/api/analyze             -o /tmp/time-result.json
          cat /tmp/time-result.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/time-result.json'))
          assert x.get('status')=='success', x
          assert len(x.get('annualStats') or []) > 0, x
          PY
