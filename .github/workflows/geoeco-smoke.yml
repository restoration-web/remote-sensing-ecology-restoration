name: GeoEco production smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose health endpoint
        run: |
          set -u
          HTTP=$(curl --show-error --silent --max-time 90 -w '%{http_code}'             https://geospatial-restoration-q1.vercel.app/api/geoeco/health             -o /tmp/health.json || true)
          echo "HTTP=$HTTP"
          echo "BODY:"
          cat /tmp/health.json || true
          echo
          test "$HTTP" = "200"

      - name: Diagnose NDVI map generation
        run: |
          set -u
          cat >/tmp/payload.json <<'JSON'
          {
            "start":"2026-01-01",
            "end":"2026-09-01",
            "layer":"NDVI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.55,-3.45],[114.65,-3.45],[114.65,-3.35],[114.55,-3.35],[114.55,-3.45]
                  ]]
                }
              }]
            }
          }
          JSON
          HTTP=$(curl --show-error --silent --max-time 180 -w '%{http_code}'             -H 'content-type: application/json'             --data-binary @/tmp/payload.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/analysis             -o /tmp/map.json || true)
          echo "HTTP=$HTTP"
          echo "BODY:"
          cat /tmp/map.json || true
          echo
          test "$HTTP" = "200"

      - name: Diagnose GeoEco temporal statistics
        run: |
          set -u
          cat >/tmp/time.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "aoiName":"Smoke AOI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.55,-3.45],[114.65,-3.45],[114.65,-3.35],[114.55,-3.35],[114.55,-3.45]
                  ]]
                }
              }]
            }
          }
          JSON
          HTTP=$(curl --show-error --silent --max-time 240 -w '%{http_code}'             -H 'content-type: application/json'             --data-binary @/tmp/time.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/temporal             -o /tmp/time-result.json || true)
          echo "HTTP=$HTTP"
          echo "BODY:"
          cat /tmp/time-result.json || true
          echo
          test "$HTTP" = "200"
