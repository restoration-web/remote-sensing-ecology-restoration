name: GeoEco large-AOI production smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          curl --fail --show-error --silent --max-time 90 https://geospatial-restoration-q1.vercel.app/api/geoeco/health

      - name: Generate NDVI for large AOI
        run: |
          cat >/tmp/payload.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "layer":"NDVI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.0,-4.0],[115.0,-4.0],[115.0,-3.0],[114.0,-3.0],[114.0,-4.0]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 240             -H 'content-type: application/json' --data-binary @/tmp/payload.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/analysis -o /tmp/map.json
          cat /tmp/map.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/map.json'))
          assert x['status']=='success',x
          assert x['imageUrl'],x
          assert len(x['legend'])==5,x
          assert len(x['classArea'])>0,x
          assert x['provenance']['scale']>=90,x
          PY

      - name: Statistics for large AOI
        run: |
          cat >/tmp/time.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.0,-4.0],[115.0,-4.0],[115.0,-3.0],[114.0,-3.0],[114.0,-4.0]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 300             -H 'content-type: application/json' --data-binary @/tmp/time.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/temporal -o /tmp/time-result.json
          cat /tmp/time-result.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/time-result.json'))
          assert x['status']=='success',x
          assert len(x['rows'])>0,x
          assert x['provenance']['spectralScale']>=90,x
          PY
