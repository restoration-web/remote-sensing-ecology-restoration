name: GeoEco production verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Repeated Earth Engine health checks
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Health attempt $i"
            curl --fail --show-error --silent --max-time 90               https://geospatial-restoration-q1.vercel.app/api/geoeco/health               -o /tmp/health.json
            cat /tmp/health.json
            python - <<'PY'
import json
x=json.load(open('/tmp/health.json'))
assert x.get('status')=='success',x
assert x.get('thumbGenerated') is True,x
PY
            sleep 2
          done

      - name: Generate NDVI for representative large AOI
        run: |
          set -euo pipefail
          cat >/tmp/payload.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "layer":"NDVI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.0,-4.0],[115.0,-4.0],[115.0,-3.0],[114.0,-3.0],[114.0,-4.0]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 300             -H 'content-type: application/json'             --data-binary @/tmp/payload.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/analysis             -o /tmp/map.json
          cat /tmp/map.json
          python - <<'PY'
import json
x=json.load(open('/tmp/map.json'))
assert x.get('status')=='success',x
assert x.get('layer')=='NDVI',x
assert x.get('imageUrl'),x
assert len(x.get('legend') or [])==5,x
assert len(x.get('classArea') or [])>0,x
assert x.get('provenance',{}).get('scale',0)>=90,x
print(x['imageUrl'])
PY
          IMG=$(python - <<'PY'
import json
print(json.load(open('/tmp/map.json'))['imageUrl'])
PY
)
          curl --fail --show-error --silent --max-time 120 "$IMG" -o /tmp/result.png
          python - <<'PY'
from pathlib import Path
p=Path('/tmp/result.png')
assert p.stat().st_size > 1000,p.stat().st_size
assert p.read_bytes()[:8] == b'PNG

'
print("PNG bytes:",p.stat().st_size)
PY

      - name: Statistics for representative large AOI
        run: |
          set -euo pipefail
          cat >/tmp/time.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.0,-4.0],[115.0,-4.0],[115.0,-3.0],[114.0,-3.0],[114.0,-4.0]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 300             -H 'content-type: application/json'             --data-binary @/tmp/time.json             https://geospatial-restoration-q1.vercel.app/api/geoeco/temporal             -o /tmp/time-result.json
          cat /tmp/time-result.json
          python - <<'PY'
import json, math
x=json.load(open('/tmp/time-result.json'))
assert x.get('status')=='success',x
rows=x.get('rows') or []
assert len(rows)>=4,x
needed=['NDVI','NDRE','NDMI','BSI','LST','Rainfall']
for k in needed:
    assert any(r.get(k) is not None for r in rows), (k,rows)
assert x.get('provenance',{}).get('spectralScale',0)>=90,x
print("Rows:",len(rows))
PY

# verification trigger
