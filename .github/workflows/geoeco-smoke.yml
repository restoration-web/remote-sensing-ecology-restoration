name: GeoEco production verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 90

      - name: Repeated Earth Engine health checks
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            curl --fail --show-error --silent --max-time 90 https://geospatial-restoration-q1.vercel.app/api/geoeco/health -o /tmp/health.json
            cat /tmp/health.json
            python -c "import json; x=json.load(open('/tmp/health.json')); assert x.get('status')=='success', x; assert x.get('thumbGenerated') is True, x"
            sleep 2
          done

      - name: Generate NDVI for representative large AOI and fetch raster
        run: |
          set -euo pipefail
          cat >/tmp/payload.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "layer":"NDVI",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.0,-4.0],[115.0,-4.0],[115.0,-3.0],[114.0,-3.0],[114.0,-4.0]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 300 -H 'content-type: application/json' --data-binary @/tmp/payload.json https://geospatial-restoration-q1.vercel.app/api/geoeco/analysis -o /tmp/map.json
          cat /tmp/map.json
          python -c "import json; x=json.load(open('/tmp/map.json')); assert x.get('status')=='success',x; assert x.get('layer')=='NDVI',x; assert len(x.get('legend') or [])==5,x; assert len(x.get('classArea') or [])>0,x; assert x.get('imageUrl'),x"
          IMG=$(python -c "import json; print(json.load(open('/tmp/map.json'))['imageUrl'])")
          curl --fail --show-error --silent --max-time 120 "$IMG" -o /tmp/result.png
          test -s /tmp/result.png
          BYTES=$(stat -c%s /tmp/result.png)
          test "$BYTES" -gt 1000
          file /tmp/result.png | grep -q "PNG image data"
          echo "PNG_BYTES=$BYTES"

      - name: Verify GeoEco statistics data for representative large AOI
        run: |
          set -euo pipefail
          cat >/tmp/time.json <<'JSON'
          {
            "start":"2024-01-01",
            "end":"2026-09-19",
            "aoi":{
              "type":"FeatureCollection",
              "features":[{
                "type":"Feature",
                "properties":{},
                "geometry":{
                  "type":"Polygon",
                  "coordinates":[[
                    [114.0,-4.0],[115.0,-4.0],[115.0,-3.0],[114.0,-3.0],[114.0,-4.0]
                  ]]
                }
              }]
            }
          }
          JSON
          curl --fail --show-error --silent --max-time 300 -H 'content-type: application/json' --data-binary @/tmp/time.json https://geospatial-restoration-q1.vercel.app/api/geoeco/temporal -o /tmp/time-result.json
          cat /tmp/time-result.json
          python -c "import json; x=json.load(open('/tmp/time-result.json')); assert x.get('status')=='success',x; rows=x.get('rows') or []; assert len(rows)>=4,x; [(_ for _ in ()).throw(AssertionError((k,rows))) if not any(r.get(k) is not None for r in rows) else None for k in ['NDVI','NDRE','NDMI','BSI','LST','Rainfall']]; print('ROWS',len(rows))"
